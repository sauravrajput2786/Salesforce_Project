<template>
    <lightning-card title="AI Executive Summary (Catch Me Up)" icon-name="standard:insights">
        <div slot="actions">
            <lightning-button-icon 
                icon-name="utility:refresh" 
                variant="border-filled" 
                alternative-text="Refresh Summary" 
                title="Refresh Summary" 
                onclick={loadSummary} 
                disabled={isLoading}>
            </lightning-button-icon>
        </div>

        <template if:true={isLoading}>
            <div class="slds-p-around_large slds-align_absolute-center">
                <lightning-spinner alternative-text="Synthesizing Executive Briefing..." size="small"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <!-- Risk Level Header -->
                <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_small">
                    <div>
                        <span class="slds-text-title_bold">{recordName}</span>
                        <template if:true={recordType}>
                            <span class="slds-badge slds-m-left_small slds-theme_shade">{recordType}</span>
                        </template>
                    </div>
                    <template if:true={hasRiskBadge}>
                        <span class={riskBadgeClass}>{riskBadgeLabel}</span>
                    </template>
                </div>

                <!-- Next Action Callout -->
                <template if:true={nextAction}>
                    <div class="action-banner slds-p-around_small slds-m-bottom_small">
                        <div class="slds-grid slds-grid_vertical-align-center">
                            <lightning-icon icon-name="utility:forward" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            <strong>Next Priority: </strong>&nbsp;{nextAction}
                        </div>
                    </div>
                </template>

                <!-- Formatted Summary Content -->
                <div class="summary-container slds-box slds-box_xx-small slds-theme_default">
                    <lightning-formatted-rich-text value={formattedSummary}></lightning-formatted-rich-text>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
