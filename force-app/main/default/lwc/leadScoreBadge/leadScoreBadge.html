<template>
    <lightning-card title="AI Lead Intelligence" icon-name="standard:lead_insights">
        <div slot="actions">
            <lightning-button-icon 
                icon-name="utility:refresh" 
                variant="border-filled" 
                alternative-text="Recalculate Score" 
                title="Recalculate Score" 
                onclick={handleRefresh} 
                disabled={isLoading}>
            </lightning-button-icon>
        </div>

        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-align_absolute-center">
                <lightning-spinner alternative-text="Analyzing Lead..." size="small"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <!-- Header Score Badge -->
                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_medium">
                    <div class="score-circle slds-m-right_medium" style={scoreCircleStyle}>
                        <span class="score-number">{currentScore}</span>
                        <span class="score-max">/100</span>
                    </div>
                    <div>
                        <span class={badgeClass}>{badgeLabel}</span>
                        <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                            Target velocity: High conversion probability
                        </div>
                    </div>
                </div>

                <!-- Next Best Action Card -->
                <div class="nba-card slds-p-around_small slds-m-bottom_small">
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_xx-small">
                        <lightning-icon icon-name="utility:strategy" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        <strong class="slds-text-title_bold text-nba-title">Einstein Next Best Action</strong>
                    </div>
                    <div class="slds-text-body_small nba-text">{nextBestAction}</div>
                </div>

                <!-- Score Reasoning -->
                <div class="slds-box slds-box_xx-small slds-theme_shade">
                    <div class="slds-text-title_caps slds-m-bottom_xx-small text-reasons-title">Score Breakdown</div>
                    <template for:each={reasonsList} for:item="reason">
                        <div key={reason} class="slds-text-body_small slds-p-vertical_xxx-small reason-item">
                            • {reason}
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
