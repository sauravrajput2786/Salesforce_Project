<template>
    <lightning-card title="Deal Health & Risk Intelligence" icon-name="standard:opportunity">
        <div slot="actions">
            <lightning-button-icon 
                icon-name="utility:refresh" 
                variant="border-filled" 
                alternative-text="Recalculate Health" 
                title="Recalculate Health" 
                onclick={handleRefresh} 
                disabled={isLoading}>
            </lightning-button-icon>
        </div>

        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-align_absolute-center">
                <lightning-spinner alternative-text="Auditing Deal Health..." size="small"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <!-- Score Bar & Level -->
                <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_medium">
                    <div class="health-circle slds-m-right_medium" style={healthCircleStyle}>
                        <span class="health-number">{currentScore}</span>
                        <span class="health-unit">/100</span>
                    </div>
                    <div>
                        <span class={riskBadgeClass}>{riskBadgeLabel}</span>
                        <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                            Forecast reliability & pipeline velocity index
                        </div>
                    </div>
                </div>

                <!-- Risk Reasons Breakdown -->
                <div class="slds-box slds-box_xx-small slds-theme_shade">
                    <div class="slds-text-title_caps slds-m-bottom_xx-small text-risks-title">Risk Analysis & Signals</div>
                    <template for:each={reasonsList} for:item="reason">
                        <div key={reason} class="slds-text-body_small slds-p-vertical_xxx-small risk-item">
                            • {reason}
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
