<template>
    <lightning-card title="Quick Opportunity Creator" icon-name="standard:opportunity">
        <div class="slds-p-around_medium card-body">

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Creating Opportunity..." size="medium"></lightning-spinner>
            </template>

            <!-- Form Grid -->
            <div class="slds-grid slds-wrap slds-gutters">

                <!-- 1. Account Selection -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                    <lightning-record-picker
                        label="Account"
                        placeholder="Search Accounts..."
                        object-api-name="Account"
                        value={selectedAccountId}
                        onchange={handleAccountChange}
                        required>
                    </lightning-record-picker>
                </div>

                <!-- 2. Contact Selection (Filtered by Account) -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                    <lightning-combobox
                        name="contact"
                        label="Contact"
                        value={selectedContactId}
                        placeholder={contactPlaceholder}
                        options={contactOptions}
                        onchange={handleContactChange}
                        disabled={isContactDisabled}>
                    </lightning-combobox>
                </div>

                <!-- 3. Product Selection -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                    <lightning-combobox
                        name="product"
                        label="Product"
                        value={selectedProductEntryId}
                        placeholder="Select a Product..."
                        options={productOptions}
                        onchange={handleProductChange}
                        required>
                    </lightning-combobox>
                </div>

                <!-- 4. Quantity -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                    <lightning-input
                        type="number"
                        label="Quantity"
                        value={quantity}
                        min="1"
                        step="1"
                        onchange={handleQuantityChange}
                        required>
                    </lightning-input>
                </div>

                <!-- 5. Amount (Calculated Total Deal Value) -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                    <lightning-input
                        type="number"
                        formatter="currency"
                        step="0.01"
                        label="Amount"
                        value={calculatedAmount}
                        onchange={handleAmountChange}
                        required>
                    </lightning-input>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_xxx-small">
                        Unit Price: {formattedUnitPrice}
                    </p>
                </div>

                <!-- 6. Close Date -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small">
                    <lightning-input
                        type="date"
                        label="Close Date"
                        value={closeDate}
                        onchange={handleCloseDateChange}
                        required>
                    </lightning-input>
                </div>

            </div>

            <!-- Action Button -->
            <div class="slds-m-top_medium slds-text-align_right">
                <lightning-button
                    variant="brand"
                    label="Create Opportunity"
                    icon-name="utility:add"
                    onclick={handleCreateOpportunity}
                    disabled={isLoading}>
                </lightning-button>
            </div>

        </div>
    </lightning-card>
</template>
