<template>
    <div class="agentforce-window">
        <!-- Exact Native Agentforce Clean Header -->
        <header class="agentforce-header slds-grid slds-grid_vertical-align-center">
            <h2 class="agentforce-title slds-col">Agentforce</h2>
            <div class="slds-grid slds-grid_vertical-align-center">
                <lightning-button-icon icon-name="utility:refresh" variant="bare" size="small" alternative-text="Reset Chat" onclick={handleResetChat} class="action-icon"></lightning-button-icon>
            </div>
        </header>

        <!-- Clean Chat Conversation Area -->
        <div class="chat-body" lwc:ref="chatBody">
            <template for:each={messages} for:item="msg">
                <div key={msg.id} class={msg.containerClass}>
                    <template if:true={msg.isBot}>
                        <div class="bot-msg-wrapper">
                            <div class="bot-bubble">
                                <lightning-formatted-rich-text value={msg.formattedText}></lightning-formatted-rich-text>
                            </div>
                        </div>
                    </template>
                    <template if:false={msg.isBot}>
                        <div class="user-msg-wrapper">
                            <div class="user-bubble">
                                {msg.text}
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Typing Indicator -->
            <template if:true={isLoading}>
                <div class="bot-msg-wrapper slds-m-top_x-small">
                    <div class="typing-indicator">
                        <span class="dot"></span>
                        <span class="dot"></span>
                        <span class="dot"></span>
                    </div>
                </div>
            </template>
        </div>

        <!-- Clean Input Box (Exact Match to Salesforce Agentforce) -->
        <footer class="agentforce-footer">
            <div class="input-container">
                <textarea 
                    class="agentforce-textarea" 
                    placeholder="Ask Agentforce..." 
                    oninput={handleInputChange}
                    onkeydown={handleKeyDown}
                    rows="2"
                    disabled={isLoading}>{inputText}</textarea>
                <button class="send-button" onclick={handleSendMessage} disabled={isSendDisabled}>
                    <lightning-icon icon-name="utility:send" size="x-small" variant="inverse"></lightning-icon>
                </button>
            </div>
        </footer>
    </div>
</template>
